name: Update README with Follower Count

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Fetch Followers Count
      id: followers
      run: |
        curl -s https://api.github.com/users/mgusain1 | jq '.followers' > followers.txt
        followers=$(cat followers.txt)
        echo "::set-output name=count::$followers"

    - name: Update README
      run: |
        count=$(cat followers.txt)
        sed -i "s/<FOLLOWERS_COUNT>/$count/" README.md
      env:
        FOLLOWERS_COUNT: ${{ steps.followers.outputs.count }}

    - name: Commit and Push Changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md
        git commit -m "Update follower count to ${{ steps.followers.outputs.count }}"
        git push
